name = "backup"
description = "Ada command-line backup utility"
version = "0.1.0-dev"
long-description = "Ada command-line backup utility with ZIP archive, manifest, verification, restore, retention job, and remote synchronization helpers."

authors = ["Bent Bracke"]
maintainers = ["Bent Bracke <bent@bracke.dk>"]
maintainers-logins = ["bracke"]
licenses = "MIT OR Apache-2.0 WITH LLVM-exception"
website = "https://github.com/bracke/backup"
tags = ["backup"]

executables = ["backup"]

[[depends-on]]
gnat_native = "=15.2.1"

[[depends-on]]
zlib = "*"

[[depends-on]]
cryptolib = "*"

[[depends-on]]
ssh_lib = "*"

[[depends-on]]
httpclient = "*"

[[depends-on]]
terminal_styles = "*"

[[depends-on]]
i18n = "*"

[[depends-on]]
messages = "*"

[[depends-on]]
project_tools = "*"

[[depends-on]]
hostkit = "*"

[[pins]]
hostkit = { path = "../hostkit" }
zlib = { path = "../zlib" }
ssh_lib = { path = "../sshlib" }
cryptolib = { path = "../cryptolib" }
httpclient = { path = "../httpclient" }
terminal_styles = { path = "../terminal_styles" }
i18n = { path = "../i18n" }
messages = { path = "../messages" }
project_tools = { path = "../project_tools" }

# Bundle i18n's generated locale data into share/i18n after every build. The
# load-only i18n serves formatting from those files at runtime, so a deployed
# bin/backup must ship them (found at Exe/../share/i18n). bundle_i18n_data is a
# standalone Ada tool (tools/i18n_bundle) kept out of the app's own bin so it is
# never installed; build it, then run it. Both steps are plain executables --
# no shell. gprbuild is incremental, so the build step is a no-op once current.
[[actions]]
type = "post-build"
command = ["gprbuild", "-P", "tools/i18n_bundle/bundle_i18n_data.gpr", "-p", "-q"]

[[actions]]
type = "post-build"
command = ["tools/i18n_bundle/bin/bundle_i18n_data"]

[[actions]]
type = "test"
command = ["sh", "-c", "cd tests && alr build && ./bin/tests"]

# Build dependencies in the development profile (-Og) too, not the default release (-O3).
# -O3 does not fix a latent bug, it hides one, and it is a lot of optimisation for code we
# are about to run a test suite over.
[build-profiles]
"*" = "development"
